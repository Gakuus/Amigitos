services:
  postgres:
    image: postgres:16-alpine
    container_name: amigitos-db
    environment:
      POSTGRES_DB: amigitos
      POSTGRES_USER: amigitos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-amigitos_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigitos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amigitos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: amigitos-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-amigitos}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-amigitos_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
